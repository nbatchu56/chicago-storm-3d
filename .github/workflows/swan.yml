name: SWAN wave library
on:
  workflow_dispatch:
    inputs:
      dirs:
        description: "Offshore directions (deg from), comma list"
        default: "0,15,30,45,60,75,90,105,120,135,150,165"
      groups:
        description: "Case groups (app.swan_cases CASE_GROUPS), comma list"
        default: "base,storm"
      merge:
        description: "Keep the swan branch's other cases (same grids) that this run doesn't redo"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: swan
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dirs: ${{ steps.m.outputs.dirs }}
      groups: ${{ steps.m.outputs.groups }}
    steps:
      - id: m
        run: |
          echo "dirs=$(python3 -c "import json,sys; print(json.dumps([int(x) for x in sys.argv[1].split(',')]))" '${{ inputs.dirs }}')" >> "$GITHUB_OUTPUT"
          echo "groups=$(python3 -c "import json,sys; print(json.dumps([x.strip() for x in sys.argv[1].split(',') if x.strip()]))" '${{ inputs.groups }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/swan
          key: swan-41.51-gnu-2
      - name: Build SWAN
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          {
            sudo apt-get update -qq && sudo apt-get install -y -qq gfortran cmake ninja-build perl >/dev/null
            if git clone -q --depth 1 https://gitlab.tudelft.nl/citg/wavemodels/swan.git src; then echo "source: gitlab"; else
              curl -fsSL -o swan.tgz https://swanmodel.sourceforge.io/download/zip/swan4151.tar.gz && mkdir -p src && tar xzf swan.tgz -C src --strip-components 1 && echo "source: sourceforge"; fi
            ls src | head -30
            cd src
            if [ -f CMakeLists.txt ]; then mkdir -p build && cd build && cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build . && cmake --install . --prefix ~/swan
            else make config && make omp && mkdir -p ~/swan/bin && cp swan.exe ~/swan/bin/ && cp swanrun ~/swan/bin/ 2>/dev/null; fi
          } > "$RUNNER_TEMP/build.log" 2>&1 || { echo "::error title=SWAN build::$(tail -c 2500 "$RUNNER_TEMP/build.log" | grep -v '^Get:\|^Hit:\|^Reading\|^Selecting\|^Preparing\|^Unpacking\|^Setting up\|^Processing' | sed 's/%/%25/g' | tr '\n' '|')"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"
      - name: Check
        run: find ~/swan -type f | head -20
  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dir: ${{ fromJson(needs.build.outputs.dirs) }}
        group: ${{ fromJson(needs.build.outputs.groups) }}   # app.swan_cases CASE_GROUPS: base (paddling season), storm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy scipy && sudo apt-get install -y -q gfortran >/dev/null
      - uses: actions/cache/restore@v4
        with:
          path: ~/swan
          key: swan-41.51-gnu-2
          fail-on-cache-miss: true
      - name: Inputs
        run: |
          git fetch -q --depth 1 origin bathy snapshot
          git show origin/bathy:bathy.json > bathy.json
          git show origin/snapshot:lakefront.json > lakefront.json
          for d in trail lane; do python -m app.swan_cases prepare --bathy bathy.json --lakefront lakefront.json --domain $d --dirs ${{ matrix.dir }} --group ${{ matrix.group }} --out runs; done
      - name: Run SWAN cases
        run: |
          EXE=$(find ~/swan -type f -perm -u+x -name 'swan*.exe' | head -1); [ -n "$EXE" ] || EXE=$(find ~/swan -type f -perm -u+x -name 'swan*' | grep -v run | head -1)
          echo "SWAN: $EXE"
          export OMP_NUM_THREADS=2
          # the 20 m lane two at a time; the 8 m trail (~1.4 M cells, ~6 GB of spectra each) one at a time
          run1() { cd "$1" && timeout 12000 $EXE > swan.log 2>&1; tail -3 PRINT 2>/dev/null | tr '\n' ' '; ls out.mat >/dev/null 2>&1 && echo " ok $1" || echo " FAILED $1"; }
          export -f run1; export EXE
          ls -d runs/lane/d* | xargs -P 2 -I{} bash -c 'run1 {}'
          ls -d runs/trail/d* | OMP_NUM_THREADS=4 xargs -P 1 -I{} bash -c 'run1 {}'
          # a case that blew up (NaN in the output, read as zero waves everywhere) runs again without the
          # diffraction term, which is what goes unstable at narrow openings
          for c in $(python - <<'PY'
          import glob, os, numpy as np
          from scipy.io import loadmat
          for f in sorted(glob.glob("runs/*/d*/out.mat")):
              hs = loadmat(f)["Hsig"]
              if np.isnan(hs).mean() > 0.001 or np.nanmax(hs) <= 0:
                  print(os.path.dirname(f))
          PY
          ); do
            echo "::warning title=SWAN ${{ matrix.dir }} ${{ matrix.group }}::$c blew up; rerunning without diffraction"
            sed -i '/^DIFFRACTION/d' "$c/INPUT"; (cd "$c" && rm -f out.mat && timeout 9000 $EXE > swan.log 2>&1); ls "$c/out.mat" >/dev/null 2>&1 && echo " rerun ok $c" || echo " rerun FAILED $c"
          done
          first=$(ls -d runs/*/d* | head -1)
          msg="exe=$EXE | $(ls $first | tr '\n' ' ') | log: $(tail -c 800 $first/swan.log 2>/dev/null) | PRINT: $(grep -i -B2 -A3 'error\|severe\|warning' $first/PRINT 2>/dev/null | head -40) | tail: $(tail -c 1200 $first/PRINT 2>/dev/null)"
          echo "::warning title=SWAN ${{ matrix.dir }} ${{ matrix.group }}::$(echo "$msg" | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-3800)"
          echo "outputs: $(ls runs/*/d*/out.mat 2>/dev/null | wc -l)"
          find runs -name 'bottom.txt' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: swan-${{ matrix.dir }}-${{ matrix.group }}
          path: |
            runs/*/meta.json
            runs/*/obstacles.json
            runs/*/d*/out.mat
            runs/*/d*/PRINT
          retention-days: 3
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge
        run: |
          mkdir -p runs
          for p in parts/*/; do cp -r "$p"* runs/ ; done
          python - <<'PY'
          import json, glob, os
          # meta.json from each job lists only that job's direction: merge the case tables
          for dom in os.listdir("runs"):
              cases = []
              for p in glob.glob(f"parts/*/{dom}/meta.json"):
                  m = json.load(open(p)); cases += m["cases"]
              m["cases"] = sorted({c["id"]: c for c in cases}.values(), key=lambda c: c["id"])
              json.dump(m, open(f"runs/{dom}/meta.json", "w"))
          PY
          M=""; if [ "${{ inputs.merge }}" = "true" ] && git fetch -q --depth 1 origin swan; then git show origin/swan:swan.json > prev.json && M="--merge prev.json"; fi
          mkdir -p out && python -m app.swan_cases collect --runs runs --out out/swan.json $M
          ls -la out; for f in runs/*/d*/PRINT; do tail -1 "$f"; done | sort | uniq -c | head
      - name: Publish to the swan branch
        run: |
          python3 -c "import json,sys; d=json.load(open('out/swan.json')); sys.exit(0 if d.get('domains') else 1)" || { echo "::warning title=SWAN::no cases collected; the swan branch is left as it was"; exit 0; }
          cd out
          git init -q -b swan
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "SWAN library $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swan
