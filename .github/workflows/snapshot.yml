name: Radar snapshot

# Builds one live scene from the newest KLOT scans and publishes it to the `snapshot` branch
# (scene.json + status.json), so it can be loaded into the viewer from anywhere.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build scene from the newest KLOT scans
        env:
          PYART_QUIET: "1"
          MPLBACKEND: Agg
          DATA_DIR: ${{ runner.temp }}/storm
          SOURCE: aws
        run: python -m app.pipeline --once
      - name: Publish to the snapshot branch
        env:
          OUT: ${{ runner.temp }}/storm
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          cp "$OUT/scene.json" "$OUT/status.json" .
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.json status.json
          git commit -q -m "KLOT snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
