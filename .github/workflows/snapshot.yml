name: Radar snapshot

# Builds one live scene from the newest KLOT scans and publishes it to the `snapshot` branch
# (scene.json + status.json + sup.json + lakefront.json), so it can be loaded into the viewer from anywhere.
on:
  workflow_dispatch:   # started by the page refresh task (about 6 AM, noon and 4 PM Chicago) or its "Refresh now" button

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: SUP wave forecast (buoys + NWS)
        continue-on-error: true
        env:
          NWS_USER_AGENT: "chicago-storm-3d (github.com/${{ github.repository }})"
        run: |
          mkdir -p "$RUNNER_TEMP/storm"
          git fetch -q --depth 1 origin bathy 2>/dev/null && git show origin/bathy:bathy.json > "$RUNNER_TEMP/bathy.json" && export BATHY_PATH="$RUNNER_TEMP/bathy.json" || echo "no bathymetry yet"
          git fetch -q --depth 1 origin learn 2>/dev/null && git show origin/learn:correction.json > "$RUNNER_TEMP/correction.json" && export LEARN_PATH="$RUNNER_TEMP/correction.json" || echo "no learned correction yet"
          python -m app.sup_waves --out "$RUNNER_TEMP/storm/sup.json"
      - name: NOAA GLWU at the buoys (scorecard second opinion)
        continue-on-error: true
        timeout-minutes: 6
        run: pip install -q eccodes && python -m app.glwu --out "$RUNNER_TEMP/glwu.json"
      - name: Scorecard (log this forecast at the buoys, score past ones)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/learn_branch.sh checkout "$RUNNER_TEMP/L"
          python -m app.learn log --sup "$RUNNER_TEMP/storm/sup.json" --glwu "$RUNNER_TEMP/glwu.json" --dir "$RUNNER_TEMP/L"
          python -m app.learn score --dir "$RUNNER_TEMP/L"
          tools/learn_branch.sh push "$RUNNER_TEMP/L" "scorecard $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Lakefront map, lake temperature and stations
        continue-on-error: true
        env:
          NWS_USER_AGENT: "chicago-storm-3d (github.com/${{ github.repository }})"
        run: |
          git fetch -q --depth 1 origin snapshot 2>/dev/null && git show origin/snapshot:lakefront.json > "$RUNNER_TEMP/prev_lakefront.json" || true
          python -m app.lakefront --out "$RUNNER_TEMP/storm/lakefront.json" --probe "$RUNNER_TEMP/storm/probe.json" --reuse "$RUNNER_TEMP/prev_lakefront.json"
      - name: Build scene from the newest KLOT scans
        continue-on-error: true
        env:
          PYART_QUIET: "1"
          MPLBACKEND: Agg
          DATA_DIR: ${{ runner.temp }}/storm
          SOURCE: aws
        run: python -m app.pipeline --once
      - name: Build the Lakefront Local page
        continue-on-error: true
        env:
          OUT: ${{ runner.temp }}/storm
        run: |
          M="$RUNNER_TEMP/models"; mkdir -p "$M"
          for b in bathy:bathy.json swan:swan.json validate:validate.json; do
            br=${b%%:*}; f=${b#*:}; git fetch -q --depth 1 origin "$br" 2>/dev/null && git show "origin/$br:$f" > "$M/$f" 2>/dev/null || rm -f "$M/$f"; done
          git fetch -q --depth 1 origin funwave 2>/dev/null && for f in $(git ls-tree --name-only origin/funwave | grep '^funwave_.*\.json$'); do git show "origin/funwave:$f" > "$M/$f"; done || true
          git fetch -q --depth 1 origin history 2>/dev/null && for f in $(git ls-tree --name-only origin/history | grep '^history-.*\.json$'); do git show "origin/history:$f" > "$M/$f"; done || true
          ls -la "$M"
          python tools/build_world.py --out "$OUT/world.html" --scene "$OUT/scene.json" --sup "$OUT/sup.json" --lakefront "$OUT/lakefront.json" \
            --bathy "$M/bathy.json" --swan "$M/swan.json" --funwave "$M"/funwave_*.json --validate "$M/validate.json" \
            --history "$M"/history-*.json --imports examples/*.json --split \
            --learn "$RUNNER_TEMP/correction.json" --scorecard "$RUNNER_TEMP/L/scorecard.json" \
            --start '{"mode":"import","view":[41.9203,-87.6195,1.58,284,34]}'
      - name: Publish to the snapshot branch
        env:
          OUT: ${{ runner.temp }}/storm
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          for f in scene.json status.json sup.json lakefront.json probe.json world.html; do [ -f "$OUT/$f" ] && cp "$OUT/$f" .; done
          [ -d "$OUT/data" ] && cp -r "$OUT/data" .   # the page's side files (lake bottom, SWAN, FUNWAVE, history)
          ls -la
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "KLOT snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
