name: Bathymetry
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Also build the wave-model grid for the route"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: bathy
  cancel-in-progress: false
jobs:
  bathy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install numpy scipy boto3 rasterio pyproj laspy lazrs tifffile
      - name: The Chicago River (USGS surveys, 3DEP lidar, Cook County footprints, OSM)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/river"
          git fetch -q --depth 1 origin bathy 2>/dev/null && git show origin/bathy:river_osm.json > "$RUNNER_TEMP/river/osm.json" 2>/dev/null || rm -f "$RUNNER_TEMP/river/osm.json"
          python -m app.river --out "$RUNNER_TEMP/out/river.json" --cache "$RUNNER_TEMP/river" 2>&1 | tee "$RUNNER_TEMP/out/river.log"
          cp "$RUNNER_TEMP/river/osm.json" "$RUNNER_TEMP/out/river_osm.json" 2>/dev/null || true
      - name: Build lake-bottom grids
        env:
          RIVER_PATH: ${{ runner.temp }}/out/river.json
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python -m app.bathymetry --out "$RUNNER_TEMP/out/bathy.json" ${{ inputs.model && '--model' || '' }} 2>&1 | tee "$RUNNER_TEMP/out/bathy.log"
      - name: Publish to the bathy branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          # never replace a good lake bottom with an empty or partial run (only the log would be left)
          if [ ! -s bathy.json ] || ! python3 -c "import json,sys; d=json.load(open('bathy.json')); sys.exit(0 if d.get('world') else 1)"; then
            echo "::warning title=Bathymetry::no bathy.json built; the bathy branch is left as it was"; exit 0; fi
          git init -q -b bathy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "bathymetry $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bathy
