name: History snapshot

# Builds the radar scene, station observations and lake temperature for past time windows and
# publishes them to the `history` branch as history-<label>.json: one window from the inputs, or
# every event in tools/events.json (optionally only the labels listed), several at a time.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start, UTC (e.g. 2026-10-23T12:20); leave empty to build the events catalog"
        required: false
      end:
        description: "End, UTC (optional, default start + 30 min)"
        required: false
      label:
        description: "File label (letters, digits, dashes); with no start: a comma list of catalog labels to build (empty = all)"
        required: false
      max_scans:
        description: "Most radar volumes per window"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          LABEL: ${{ inputs.label }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          start, end, label = os.environ["START"].strip(), os.environ["END"].strip(), os.environ["LABEL"].strip()
          if start:
              if not re.fullmatch(r"[A-Za-z0-9-]+", label): raise SystemExit("bad label")
              wins = [{"label": label, "start": start, "end": end}]
          else:
              cat = json.load(open("tools/events.json"))["events"]
              want = {x.strip() for x in label.split(",") if x.strip()}
              wins = [{"label": e["label"], "start": e["start"], "end": e["end"]} for e in cat if not want or e["label"] in want]
              missing = want - {w["label"] for w in wins}
              if missing: raise SystemExit(f"not in the catalog: {sorted(missing)}")
          print("windows=" + json.dumps(wins))
          EOF

  history:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        window: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build history
        env:
          PYART_QUIET: "1"
          MPLBACKEND: Agg
          NWS_USER_AGENT: "chicago-storm-3d (github.com/${{ github.repository }})"
          START: ${{ matrix.window.start }}
          END: ${{ matrix.window.end }}
          LABEL: ${{ matrix.window.label }}
          MAX_SCANS: ${{ inputs.max_scans }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$END" ]; then E="--end $END"; else E=""; fi
          python -m app.history --start "$START" $E --max-scans "${MAX_SCANS:-12}" --out "$RUNNER_TEMP/out/history-$LABEL.json"
          ls -la "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.window.label }}
          path: ${{ runner.temp }}/out/history-*.json
          retention-days: 3

  publish:
    needs: history
    if: ${{ always() && needs.history.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Publish to the history branch
        run: |
          ls -la "$RUNNER_TEMP/out" || { echo "nothing built"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q -b history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" history 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . 2>/dev/null || true
            git reset -q --soft FETCH_HEAD
          fi
          cp "$RUNNER_TEMP"/out/*.json .            # a new build replaces an earlier one with the same label
          git add -A
          git commit -q -m "history $(ls "$RUNNER_TEMP"/out | sed 's/^history-//; s/\.json$//' | tr '\n' ' ')" || echo "unchanged"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:history
