name: El Niño composites
# The 1979+ Lake Michigan composites by ENSO phase (app.enso climate): O'Hare, GLERL ice (annual max and gridded), GLSEA,
# Calumet Harbor levels, ERA5 wind at buoy 45198. Monthly (a new winter's numbers or a revised ONI), or by hand.
# Also the jet stream study (app.jet climate): lakefront gusts by jet-streak quadrant (reanalysis 2016+ and NDBC), and the
# subtropical jet's winter latitude by ENSO phase; past years' reanalysis metrics are kept on the branch (jet/) as a cache.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 3 * *"
permissions:
  contents: write
concurrency:
  group: enso
  cancel-in-progress: false
jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install numpy scipy
      - name: ERA5 wind at the buoys (learn branch cache)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin learn && mkdir -p era5 && for f in $(git ls-tree --name-only origin/learn era5/); do git show "origin/learn:$f" > "$f"; done; ls era5 | wc -l
      - name: Composites
        run: |
          mkdir -p out && python -m app.enso climate --out out/enso_climate.json --era5 era5 2>&1 | tail -60
          python3 -c "import json,sys; d=json.load(open('out/enso_climate.json')); n=len(d['winters']); print(n, 'winters'); sys.exit(0 if n > 30 else 1)"
      - name: Jet stream study
        continue-on-error: true
        timeout-minutes: 40
        run: |
          git fetch -q --depth 1 origin enso 2>/dev/null && mkdir -p out/jet && for f in $(git ls-tree --name-only origin/enso jet/ 2>/dev/null); do git show "origin/enso:$f" > "out/$f"; done
          # the current year's file is rebuilt (it grows); finished years come from the cache
          rm -f "out/jet/jet_r1_$(date -u +%Y).json"
          python -m app.jet climate --out out/jet_climate.json --first 2016 --cache out/jet > jet.log 2>&1 || echo "jet study failed"; tail -40 jet.log
          [ -s out/jet_climate.json ] || git show origin/enso:jet_climate.json > out/jet_climate.json || true   # keep the last study
      - name: Publish to the enso branch
        run: |
          cd out
          git init -q -b enso
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "El Niño composites $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" enso
